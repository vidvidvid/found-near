name: CI

# Runs the offline checks from the README on every push and pull request.
# Railway waits for this to pass before deploying a push to main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run census:verify
      - run: npm run dormancy:verify
      - run: npm run dormancy:code:verify
      - run: npm run sizing:figures
